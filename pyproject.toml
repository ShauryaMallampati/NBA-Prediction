[tool.poetry]
name = "nba-prediction"
version = "5.0.0"
description = "Pregame NBA ensemble prediction and evaluation tools"
authors = ["Shaurya Mallampati"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.26,<3"
pandas = ">=2.2,<3"
scikit-learn = ">=1.4,<1.8"
# macOS ships a CPU wheel under xgboost; Linux/Windows use the CPU-only distribution.
xgboost = {version = "3.1.3", markers = "sys_platform == 'darwin'"}
xgboost-cpu = {version = "3.1.3", markers = "sys_platform != 'darwin'"}
lightgbm = ">=4.5,<5"
catboost = ">=1.2,<2"
optuna = ">=4,<5"
pyarrow = ">=15,<24"
pydantic = ">=2,<3"
pydantic-settings = ">=2,<3"
fastapi = ">=0.115,<0.130"
uvicorn = ">=0.30,<0.41"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.6,<1"
httpx = ">=0.27,<1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
