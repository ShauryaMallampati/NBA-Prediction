[tool.poetry]
name = "nba-prediction"
version = "1.0.0"
description = "NBA Game Prediction using 7-way Multimodal Fusion"
authors = ["Shaurya Mallampati <shaurya@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
scikit-learn = ">=1.0.0"
xgboost = ">=2.0.0"
catboost = ">=1.0.0"
nba-api = ">=1.4.0"
yt-dlp = ">=2024.0.0"
opencv-python = ">=4.7.0"
librosa = ">=0.10.0"
moviepy = ">=1.0.3"
tqdm = ">=4.65.0"
supabase = ">=1.0.0"
python-dotenv = ">=1.0.0"
requests = ">=2.31.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
joblib = ">=1.3.0"
lightgbm = "^4.6.0"
optuna = "^4.6.0"
pyarrow = "^23.0.0"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
jupyter = ">=1.0.0"
ipykernel = ">=6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
