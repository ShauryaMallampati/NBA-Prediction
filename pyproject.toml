[tool.poetry]
name = "nba-intel"
version = "0.1.0"
description = "Full-Stack NBA Intelligence Platform with ML predictions"
authors = ["NBA Intel Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.1.0"
numpy = "^1.25.0"
scikit-learn = "^1.3.0"
lightgbm = "^4.6.0"
xgboost = "^2.0.0"
optuna = "^3.4.0"
shap = "^0.49.0"
torch = "^2.5.0"
torch-geometric = "^2.6.0"
torchvision = "^0.20.0"
transformers = "^4.35.0"
sentence-transformers = "^2.2.0"
opencv-python = "^4.8.0"
fastapi = "^0.115.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
celery = "^5.3.0"
redis = "^5.0.0"
psycopg2-binary = "^2.9.0"
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
httpx = "^0.28.0"
beautifulsoup4 = "^4.12.0"
lxml = "^4.9.0"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.0"
pyarrow = "^14.0.0"
requests = "^2.31.0"
tweepy = "^4.14.0"
praw = "^7.7.0"
google-api-python-client = "^2.108.0"
nba-api = "1.5.2"
catboost = "^1.2.8"
textblob = "^0.19.0"
supabase = "^2.27.2"
yt-dlp = "^2025.12.8"
accelerate = "^1.12.0"
bitsandbytes = "^0.49.1"
google-generativeai = "^0.8.0"
pytube = "^15.0.0"
pytubefix = "^10.3.6"
selenium = "<4.30.0"
undetected-chromedriver = "^3.5.5"
curl-cffi = "^0.14.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
mypy = "^1.7.0"
ruff = "^0.1.6"
black = "^23.11.0"
pre-commit = "^3.5.0"
jupyter = "^1.0.0"
ipykernel = "^6.26.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
