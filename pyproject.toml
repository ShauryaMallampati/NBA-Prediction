[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo-llm-strategy-shaping"
version = "1.0.0"
description = "LLM-Guided Reward Shaping for Multi-Agent Coordination in Overcooked"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Shaurya Mallampati", email = "shaurya@example.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "stable-baselines3[extra]>=2.0.0",
    "gymnasium>=0.28.0",
    "gym>=0.26.0",
    "shimmy>=2.0.0",
    "overcooked-ai>=1.1.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/ShauryaMallampati/PPO-LLM-Strategy-Shaping"
Repository = "https://github.com/ShauryaMallampati/PPO-LLM-Strategy-Shaping"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
