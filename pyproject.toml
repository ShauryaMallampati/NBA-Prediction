[project]
name = "nba-prediction"
version = "5.0.0"
description = "Chronological pregame NBA winner prediction with a tabular tree-model ensemble"
authors = [{name = "Shaurya Mallampati", email = "ShauryaMallampati@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"

# Everything the released training and prediction path imports, and nothing else.
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.6.0",
    "catboost>=1.0.0",
]

[project.urls]
Repository = "https://github.com/ShauryaMallampati/NBA-Prediction"

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
