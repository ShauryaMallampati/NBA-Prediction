# Pregame Model Hyperparameters

lightgbm:
  objective: "binary"
  metric: "binary_logloss"
  boosting_type: "gbdt"
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 7
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  n_jobs: -1
  verbose: -1

calibration:
  method: "isotonic"  # or "platt"
  cv_folds: 5

feature_selection:
  enabled: true
  method: "shap"
  top_k: 50

elo:
  k0: 32
  decay_rate: 0.95
  margin_multiplier: 0.05
  home_bonus: 100
  initial_rating: 1500
