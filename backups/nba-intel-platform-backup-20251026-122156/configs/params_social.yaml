# Social Signal Module Parameters

sources:
  twitter:
    enabled: true
    lookback_hours: 6
    max_tweets: 1000
    languages: ["en"]
  reddit:
    enabled: true
    subreddits: ["nba", "lakers", "warriors"]  # expand per team
    lookback_hours: 6
    max_posts: 500
  youtube:
    enabled: true
    lookback_hours: 24
    max_videos: 100

sentiment:
  model: "distilbert-base-uncased-finetuned-sst-2-english"
  batch_size: 32
  confidence_threshold: 0.6

stance:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  similarity_threshold: 0.7

aggregation:
  team_weight_method: "minutes_played"
  spike_detection_zscore: 2.0
  controversy_keywords: ["injury", "trade", "suspension", "fine"]

graph_edges:
  alpha: 0.6  # co-mention weight
  beta: 0.4   # stance weight
  decay_halflife: 14  # days
  clip_percentiles: [5, 95]
