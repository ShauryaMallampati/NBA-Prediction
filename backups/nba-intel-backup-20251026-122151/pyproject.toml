[tool.poetry]
name = "nba-intel"
version = "0.1.1"
description = "Full-Stack NBA Intelligence Platform"
authors = ["NBA Intel Devs <dev@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.3"
numpy = "^2.1.2"
scikit-learn = "^1.5.2"
lightgbm = "^4.5.0"
xgboost = "^2.1.1"
optuna = "^4.0.0"
shap = "^0.46.0"
torch = "^2.4.1"
torchvision = "^0.19.1"
torchaudio = "^2.4.1"
torch-geometric = "^2.5.3"
transformers = "^4.45.2"
sentence-transformers = "^3.1.1"
fastapi = "^0.115.0"
pydantic = "^2.9.2"
uvicorn = "^0.31.1"
redis = "^5.0.8"
apscheduler = "^3.10.4"
psycopg2-binary = "^2.9.9"
pyyaml = "^6.0.2"
python-dotenv = "^1.0.1"
decord = "^0.6.0"
opencv-python = "^4.10.0.84"
ffmpeg-python = "^0.2.0"
tqdm = "^4.66.5"
httpx = "^0.27.2"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"
joblib = "^1.4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
mypy = "^1.13.0"
ruff = "^0.6.9"
black = "^24.8.0"
pre-commit = "^4.0.1"
types-requests = "^2.32.0.20241016"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
