name: 🤖 Daily Model Retraining

on:
  schedule:
    # Run every day at 3 AM EST (8 AM UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: 🔧 Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: 📚 Install dependencies
        run: poetry install --no-interaction
      
      - name: 📊 Collect latest NBA data
        run: |
          echo "Collecting advanced stats..."
          poetry run python scripts/scrape_advanced_stats.py || true
          
          echo "Collecting news sentiment..."
          poetry run python scripts/scrape_news_sentiment.py || true
          
          echo "Collecting player tracking..."
          poetry run python scripts/scrape_player_tracking.py || true
      
      - name: 🔧 Engineer features
        run: |
          echo "Engineering features with all collected data..."
          poetry run python src/features/engineer_features.py
      
      - name: 🤖 Train ensemble model
        run: |
          echo "Training XGBoost + LightGBM + CatBoost ensemble..."
          poetry run python src/models/pregame/train_ensemble.py
      
      - name: 📈 Evaluate model performance
        id: evaluate
        run: |
          echo "Evaluating model on test set..."
          poetry run python src/models/pregame/evaluate_model.py > evaluation_results.txt
          
          # Extract accuracy from results
          ACCURACY=$(grep "Test Accuracy" evaluation_results.txt | awk '{print $3}')
          echo "accuracy=$ACCURACY" >> $GITHUB_OUTPUT
          
          cat evaluation_results.txt
      
      - name: 💾 Save model artifacts
        uses: actions/upload-artifact@v3
        with:
          name: trained-models
          path: |
            artifacts/models/
            artifacts/features/
            artifacts/plots/
          retention-days: 90
      
      - name: 📊 Generate performance report
        run: |
          echo "# 🤖 Daily Model Retraining Report" > report.md
          echo "" >> report.md
          echo "**Date:** $(date)" >> report.md
          echo "**Accuracy:** ${{ steps.evaluate.outputs.accuracy }}" >> report.md
          echo "" >> report.md
          echo "## Model Performance" >> report.md
          cat evaluation_results.txt >> report.md
      
      - name: 📝 Comment on commit (if manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: require('fs').readFileSync('report.md', 'utf8')
            })
      
      - name: 🚨 Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Model Retraining Failed',
              body: 'Automated model retraining failed. Please check the logs.',
              labels: ['bug', 'automated']
            })
