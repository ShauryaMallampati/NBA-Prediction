name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy FastAPI Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
    
    - name: Install dependencies
      run: poetry install --no-interaction --no-dev
    
    - name: Build Docker image
      run: docker build -t nba-intel-backend:latest -f Dockerfile .
    
    - name: Deploy to production (placeholder)
      run: |
        echo "Deploying backend to production..."
        # Add your deployment commands here
        # Examples:
        # - docker push to registry
        # - kubectl apply for Kubernetes
        # - terraform apply for infrastructure
        # - ansible playbook for server deployment

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Next.js app
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
    
    - name: Deploy to Vercel (or your hosting)
      run: |
        echo "Deploying frontend to production..."
        # Add Vercel deployment or other hosting
        # npm install -g vercel
        # vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

  run-daily-predictions:
    name: Generate Daily Predictions
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Scrape NBA schedule
      run: poetry run python scripts/scrape_current_schedule.py
    
    - name: Update schedule database
      run: poetry run python scripts/update_schedule_database.py
    
    - name: Scrape ESPN data
      run: poetry run python scripts/scrape_espn_data.py
    
    - name: Generate predictions
      run: poetry run python scripts/generate_todays_predictions.py
    
    - name: Commit and push predictions
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add artifacts/predictions/*.csv data/schedules/*.csv data/espn/*.csv
        git commit -m "Daily predictions: $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push

  retrain-model-weekly:
    name: Retrain Model (Weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Download latest NBA data
      run: |
        echo "Downloading latest game data..."
        # Add data download scripts
    
    - name: Retrain ensemble model
      run: poetry run python src/models/pregame/train_ensemble.py
    
    - name: Run model tests
      run: poetry run pytest tests/test_model.py -v
    
    - name: Commit and push new models
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add artifacts/models/pregame/*
        git commit -m "Model retrain: $(date +'%Y-%m-%d')" || echo "No model changes"
        git push
