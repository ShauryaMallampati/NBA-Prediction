name: Daily Predictions

on:
  schedule:
    # Run every day at 9 AM UTC (4 AM EST, before games start)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  generate-predictions:
    name: Generate Today's Predictions
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.6.1
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction --no-root
    
    - name: Scrape NBA schedule
      run: poetry run python scripts/scrape_current_schedule.py
    
    - name: Update schedule database
      run: poetry run python scripts/update_schedule_database.py
    
    - name: Scrape ESPN injury data
      run: poetry run python scripts/scrape_espn_data.py
    
    - name: Generate today's predictions
      run: poetry run python scripts/generate_todays_predictions.py
    
    - name: Commit and push predictions
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add artifacts/predictions/*.csv data/schedules/*.csv data/espn/*.csv data/live/*.json
        git diff-index --quiet HEAD || git commit -m "🤖 Daily predictions: $(date +'%Y-%m-%d')"
        git push || echo "No changes to push"
