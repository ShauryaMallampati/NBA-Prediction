name: NBA Daily Pipeline

on:
  schedule:
    # Run at 7:00 AM ET (12:00 UTC) every day
    - cron: '0 12 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main (for testing)
  push:
    branches: [ "main" ]

jobs:
  daily-nba-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit data back to repo

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    # === NEW: Fetch 14-Day Schedule ===
    - name: Fetch Schedule (14 Days)
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        poetry run python scripts/fetch_schedule.py --days 14

    # === NEW: Refresh Chemistry Data ===
    - name: Refresh Chemistry Data
      run: |
        poetry run python scripts/fetch_lineup_data.py || echo "Chemistry fetch skipped (optional)"

    - name: Run Daily Predictions
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        # Generate predictions for today
        poetry run python scripts/run_daily_predictions.py

    - name: Run Daily Evaluation (Yesterday)
      run: |
        # Evaluate yesterday's predictions
        # (Script defaults to yesterday if no date provided)
        poetry run python scripts/run_daily_evaluation.py

    # === NEW: Daily Agent Loop (Vision + Analysis) ===
    - name: Run Daily Vision Agent
      run: |
        # Find highlights and simulate vision training
        poetry run python scripts/daily_vision_agent.py

    - name: Run Post-Game Analysis (Qwen + Web Search)
      env:
        OPENAI_API_KEY: "dummy" # Qwen is local, but just in case
      run: |
        # Explain why predictions were wrong using AI + Trends
        poetry run python scripts/analyze_wrong_predictions.py

    # === NEW: Sync to Supabase ===
    - name: Sync to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        poetry run python scripts/sync_to_supabase.py

    - name: Commit and Push Data
      run: |
        git config --global user.name "NBA Intel Bot"
        git config --global user.email "bot@nbaintel.com"
        
        # Add new data files with force to bypass .gitignore if needed
        if [ -d "data/predictions" ]; then
          git add -f data/predictions/ 2>/dev/null || echo "No new predictions"
        fi
        
        if [ -d "data/schedules" ]; then
          git add -f data/schedules/ 2>/dev/null || echo "No new schedules"
        fi
        
        if [ -d "data/chemistry" ]; then
          git add -f data/chemistry/ 2>/dev/null || echo "No new chemistry"
        fi

        if [ -d "data/analysis" ]; then
          git add -f data/analysis/ 2>/dev/null || echo "No new analysis"
        fi
        
        if [ -f "data/metrics/daily_accuracy.csv" ]; then
          git add -f data/metrics/daily_accuracy.csv 2>/dev/null || echo "No new metrics"
        fi
        
        # Determine if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Daily NBA predictions & evaluation metrics [skip ci]"
          git push
        fi
