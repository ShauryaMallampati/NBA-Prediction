name: NBA Daily Pipeline

on:
  schedule:
    # Run at 1:30 AM ET (06:30 UTC) every day
    - cron: '30 6 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main (for testing) - only on code changes
  # push:
  #   branches: [ "main" ]
  #   paths:
  #     - 'src/**'
  #     - 'scripts/**'
  #     - 'tests/**'
  #     - '.github/workflows/**'
  #     - 'pyproject.toml'
  #     - 'package.json'

jobs:
  daily-nba-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit data back to repo

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    # === NEW: Fetch 14-Day Schedule ===
    - name: Fetch Schedule (14 Days)
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        if [ -f "scripts/fetch_schedule.py" ]; then
          poetry run python scripts/fetch_schedule.py --days 14
        else
          echo "scripts/fetch_schedule.py not found, skipping"
        fi

    # === NEW: Refresh Chemistry Data ===
    - name: Refresh Chemistry Data
      run: |
        if [ -f "scripts/fetch_lineup_data.py" ]; then
          poetry run python scripts/fetch_lineup_data.py || echo "Chemistry fetch skipped (optional)"
        else
          echo "scripts/fetch_lineup_data.py not found, skipping"
        fi

    - name: Run Daily Predictions
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        # Generate predictions for today
        if [ -f "scripts/run_daily_predictions.py" ]; then
          poetry run python scripts/run_daily_predictions.py
        else
          echo "scripts/run_daily_predictions.py not found, skipping"
        fi

    - name: Run Daily Evaluation (Yesterday)
      run: |
        # Evaluate yesterday's predictions
        # (Script defaults to yesterday if no date provided)
        if [ -f "scripts/run_daily_evaluation.py" ]; then
          poetry run python scripts/run_daily_evaluation.py
        else
          echo "scripts/run_daily_evaluation.py not found, skipping"
        fi

    # === NEW: Daily Agent Loop (Vision + Analysis) ===
    - name: Run Daily Vision Agent
      run: |
        # Find highlights and simulate vision training
        if [ -f "scripts/daily_vision_agent.py" ]; then
          poetry run python scripts/daily_vision_agent.py
        else
          echo "scripts/daily_vision_agent.py not found, skipping"
        fi

    - name: Run Post-Game Analysis (Gemini AI)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Explain why predictions were wrong using Gemini AI
        if [ -f "scripts/analyze_wrong_predictions.py" ]; then
          poetry run python scripts/analyze_wrong_predictions.py
        else
          echo "scripts/analyze_wrong_predictions.py not found, skipping"
        fi

    # === NEW: Sync to Supabase ===
    - name: Sync to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        if [ -f "scripts/sync_to_supabase.py" ]; then
          poetry run python scripts/sync_to_supabase.py
        else
          echo "scripts/sync_to_supabase.py not found, skipping"
        fi

    - name: Commit and Push Data
      run: |
        git config --global user.name "NBA Intel Bot"
        git config --global user.email "bot@nbaintel.com"
        
        # Add ALL generated data files
        if [ -d "data/predictions" ]; then
          git add -f data/predictions/ 2>/dev/null || echo "No new predictions"
        fi
        
        if [ -d "data/schedules" ]; then
          git add -f data/schedules/ 2>/dev/null || echo "No new schedules"
        fi
        
        if [ -d "data/chemistry" ]; then
          git add -f data/chemistry/ 2>/dev/null || echo "No new chemistry"
        fi

        if [ -d "data/analysis" ]; then
          git add -f data/analysis/ 2>/dev/null || echo "No new analysis"
        fi
        
        if [ -f "data/metrics/daily_accuracy.csv" ]; then
          git add -f data/metrics/daily_accuracy.csv 2>/dev/null || echo "No new metrics"
        fi
        
        # Also add any other loose data files that might exist
        git add -f data/ 2>/dev/null || echo "No data changes"
        
        # Determine if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Daily NBA predictions & evaluation metrics [skip ci]"
          
          # Handle concurrent commits: fetch, rebase, then push with retry
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Push attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES"
            
            # Stash any unstaged changes before rebase
            git stash --include-untracked || echo "Nothing to stash"
            
            # Fetch latest and rebase our commit on top
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed, aborting and trying force push"
              git rebase --abort 2>/dev/null || true
              git stash pop 2>/dev/null || true
              git push origin main --force-with-lease && break
            }
            
            # Pop stash after successful rebase
            git stash pop 2>/dev/null || echo "No stash to pop"
            
            # Try to push
            if git push origin main; then
              echo "Push successful!"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi
        fi
