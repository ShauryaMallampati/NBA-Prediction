name: 🎯 Generate Daily Predictions

on:
  schedule:
    # Run every day at 10 AM EST (3 PM UTC) - before games start
    - cron: '0 15 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: 📚 Install dependencies
        run: poetry install --no-interaction
      
      - name: 🏀 Fetch today's NBA schedule
        run: |
          echo "Fetching today's games..."
          poetry run python scripts/scrape_live_nba_schedule.py
      
      - name: 📊 Collect latest stats
        run: |
          echo "Collecting latest injury reports..."
          poetry run python scripts/scrape_espn_data.py || true
          
          echo "Enhancing features with injuries..."
          poetry run python scripts/enhance_features_with_injuries.py || true
      
      - name: 🎯 Generate predictions
        id: predict
        run: |
          echo "Generating today's predictions..."
          poetry run python scripts/generate_todays_predictions.py > predictions.txt
          
          # Count games predicted
          GAME_COUNT=$(grep "Game:" predictions.txt | wc -l)
          echo "game_count=$GAME_COUNT" >> $GITHUB_OUTPUT
          
          cat predictions.txt
      
      - name: 📄 Save predictions
        uses: actions/upload-artifact@v3
        with:
          name: daily-predictions
          path: |
            data/predictions/todays_predictions_*.csv
            data/predictions/todays_predictions_*.json
          retention-days: 30
      
      - name: 📊 Create prediction summary
        run: |
          echo "# 🎯 Daily NBA Predictions" > summary.md
          echo "" >> summary.md
          echo "**Date:** $(date)" >> summary.md
          echo "**Games Today:** ${{ steps.predict.outputs.game_count }}" >> summary.md
          echo "" >> summary.md
          echo "## Predictions" >> summary.md
          cat predictions.txt >> summary.md
      
      - name: 📝 Create GitHub Issue with predictions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎯 Daily Predictions - ${new Date().toLocaleDateString()}`,
              body: summary,
              labels: ['predictions', 'automated']
            })
      
      - name: 🚨 Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Daily Prediction Generation Failed',
              body: 'Automated prediction generation failed. Please check the logs.',
              labels: ['bug', 'automated']
            })
