# Vision Model Parameters

model:
  backbone: "mobilenet_v3_small"  # or efficientnet_b0
  pretrained: true
  num_classes: 5  # dunk, block, assist, neutral, foul_candidate
  dropout: 0.3

video:
  num_frames: 16
  frame_size: 224
  fps: 30
  clip_duration: 3  # seconds

training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_epochs: 30
  mixed_precision: true

augmentation:
  random_crop: true
  random_flip: true
  color_jitter: 0.2
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

inference:
  confidence_threshold: 0.7
  nms_threshold: 0.5
