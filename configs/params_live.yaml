# Live Win Probability Model Parameters

gru:
  input_size: 32
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  bidirectional: false

training:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 50
  early_stopping_patience: 10
  gradient_clip: 1.0

sequence:
  max_length: 200
  min_length: 10
  stride: 1

optimizer:
  type: "adam"
  betas: [0.9, 0.999]
  eps: 1.0e-8
